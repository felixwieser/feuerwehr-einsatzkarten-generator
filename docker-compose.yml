# Docker-Compose-Setup für eigene, selbst gehostete Routing- (OSRM) und
# Geocoding-Dienste (Nominatim).
#
# WICHTIG: Diese Container sind NICHT sofort einsatzbereit, nachdem du
# "docker compose up" ausgeführt hast! Für OSRM muss vorher einmalig ein
# Kartenausschnitt heruntergeladen und aufbereitet werden (siehe
# scripts/setup-osrm-data.sh), für Nominatim läuft beim allerersten Start
# ein Datenimport, der - je nach Kartengröße - mehrere Stunden dauern und
# viele GB Speicherplatz belegen kann.
#
# Solange du das nicht eingerichtet hast, nutzt die App automatisch die
# öffentlichen Demo-Server von OSRM/Nominatim (siehe .env.example). Das ist
# praktisch zum Ausprobieren, aber laut Nutzungsbedingungen NICHT für
# Dauerbetrieb/größeres Volumen gedacht.
#
# Ausführliche Schritt-für-Schritt-Anleitung: siehe README.md, Abschnitt
# "Eigene Routing-/Geocoding-Server einrichten (optional, aber empfohlen)".

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: feuerwehrkarten-osrm
    restart: unless-stopped
    ports:
      - '5000:5000'
    volumes:
      - ./docker/osrm-data:/data
    # Der eigentliche Datenimport (osrm-extract/partition/customize) läuft
    # NICHT hier, sondern einmalig über scripts/setup-osrm-data.sh.
    # Dieser Service startet danach nur noch den Routing-Server (osrm-routed)
    # auf Basis der bereits aufbereiteten Datei.
    command: >
      osrm-routed --algorithm mld --max-table-size 10000 /data/region.osrm
    # Falls unter ./docker/osrm-data noch keine region.osrm liegt, wird
    # dieser Container mit einem Fehler beenden - das ist normal, solange
    # du Schritt "OSRM-Kartendaten vorbereiten" aus dem README noch nicht
    # ausgeführt hast.

  nominatim:
    image: mediagis/nominatim:4.4
    container_name: feuerwehrkarten-nominatim
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # PBF-Datei, aus der Nominatim beim allerersten Start importiert.
      # Lege dieselbe .osm.pbf-Datei, die du für OSRM heruntergeladen hast,
      # zusätzlich unter ./docker/nominatim-data/data.osm.pbf ab (siehe README).
      PBF_PATH: /nominatim/data.osm.pbf
      # Reduziert den Import auf das Wesentliche (Adressen/Straßen) und
      # beschleunigt den Erstimport spürbar. Bei Bedarf entfernen.
      IMPORT_STYLE: extratags
      # Anzahl CPU-Threads für den Import - an eure Maschine anpassen.
      THREADS: 4
    volumes:
      - ./docker/nominatim-data:/nominatim
      - nominatim-postgres-data:/var/lib/postgresql/14/main
    shm_size: 1g

volumes:
  nominatim-postgres-data:
