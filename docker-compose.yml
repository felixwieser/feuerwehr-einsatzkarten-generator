# Docker-Compose-Setup für einen eigenen, selbst gehosteten Geocoding-Dienst
# (Nominatim). Routing läuft seit der Umstellung auf openrouteservice (ORS)
# über deren Cloud-API (siehe src/lib/routing.ts, ORS_API_KEY in .env) - dafür
# gibt es keinen Selbst-Hosting-Baustein mehr, dieses Compose-File betrifft
# nur noch die Adresssuche.
#
# WICHTIG: Der Container ist NICHT sofort einsatzbereit, nachdem du
# "docker compose up" ausgeführt hast! Beim allerersten Start läuft ein
# Datenimport, der - je nach Kartengröße - mehrere Stunden dauern und viele
# GB Speicherplatz belegen kann.
#
# Solange du das nicht eingerichtet hast, nutzt die App automatisch den
# öffentlichen Demo-Server von Nominatim (siehe .env.example). Das ist
# praktisch zum Ausprobieren, aber laut Nutzungsbedingungen NICHT für
# Dauerbetrieb/größeres Volumen gedacht.
#
# Ausführliche Schritt-für-Schritt-Anleitung: siehe README.md, Abschnitt
# "Eigenen Nominatim-Server einrichten (optional)".

services:
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: feuerwehrkarten-nominatim
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      # PBF-Datei, aus der Nominatim beim allerersten Start importiert.
      # Lege eure heruntergeladene .osm.pbf-Datei unter
      # ./docker/nominatim-data/data.osm.pbf ab (siehe README.md Schritt 8.2).
      PBF_PATH: /nominatim/data.osm.pbf
      # Reduziert den Import auf das Wesentliche (Adressen/Straßen) und
      # beschleunigt den Erstimport spürbar. Bei Bedarf entfernen.
      IMPORT_STYLE: extratags
      # Anzahl CPU-Threads für den Import - an eure Maschine anpassen.
      THREADS: 4
    volumes:
      - ./docker/nominatim-data:/nominatim
      - nominatim-postgres-data:/var/lib/postgresql/14/main
    shm_size: 1g

volumes:
  nominatim-postgres-data:
